<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <header>
      <div class="logo">MySite</div>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Menu</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="grid-layout">
        <div class="sidebar">
          <h2>Sidebar</h2>

          <div class="inputGroup">
            <input
              type="text"
              id="projectNameInput"
              placeholder="Enter project name"
            />
            <button id="addProjectBtn">Add Project</button>
          </div>
          <div id="projectsDiv">
            <ul id="projectsUl"></ul>
          </div>
        </div>

        <div id="tasksDiv">
          <section>
            <h2 id="tasksHeading">Projects</h2>
            <div id="tasksDivContent"></div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 MySite. All rights reserved.</p>
      <div class="socials">
        <a href="#">Twitter</a> | <a href="#">Instagram</a>
      </div>
    </footer>
  </body>
</html>
