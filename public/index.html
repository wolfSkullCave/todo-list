<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <header>
      <div class="logo">MySite</div>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Menu</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="grid-layout">
        <div class="sidebar">
          <h2>Sidebar</h2>

          <div class="inputGroup">
            <input
              type="text"
              id="projectNameInput"
              placeholder="Enter project name"
            />
            <button id="addProjectBtn">Add Project</button>
          </div>
          <div id="projectsDiv">
            <ul id="projectsUl"></ul>
          </div>
        </div>

        <div id="tasksDiv">
          <section>
            <div class="taskHeader">
              <h2 id="tasksHeading">Projects</h2>

              <!-- Button to open form -->
              <button id="openFormBtn">Add Task</button>

              <!-- Hidden pop-up form -->
              <div id="popupForm" class="popup">
                <div class="popup-content">
                  <span id="closeFormBtn" class="close">&times;</span>
                  <h2>Add a New Task</h2>
                  <form id="taskForm">
                    <label for="taskName">Task Name:</label>
                    <input type="text" id="taskName" name="taskName" required />

                    <label for="taskDesc">Description:</label>
                    <textarea id="taskDesc" name="taskDesc"></textarea>

                    <label for="taskPriority">Priority:</label>
                    <select name="taskPriority" id="taskPriority">
                      <option value="low">Low</option>
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                    </select>
                  </form>
                  <button type="submit">Save Task</button>
                </div>
              </div>
            </div>
            <div id="tasksDivContent"></div>

            <!-- Hidden template -->
            <template id="card-template">
              <div class="card">
                <!-- <img class="card-img" src="" alt="Card image" /> -->
                <h3 class="card-title"></h3>
                <p class="card-description"></p>

                <p class="card-duDate"></p>
                <p class="card-priority"></p>
                <p class="card-status"></p>
              </div>
            </template>

            <!-- Container where cards will be inserted -->
            <div id="card-container"></div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 MySite. All rights reserved.</p>
      <div class="socials">
        <a href="#">Twitter</a> | <a href="#">Instagram</a>
      </div>
    </footer>
  </body>
</html>
