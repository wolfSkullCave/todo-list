<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Webpack Template</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <!-- Project list -->
        <h2>Projects</h2>
        <div>
          <input type="text" id="addProjectInput" placeholder="Add Project" />
          <button type="button" id="addProjectBtn">+</button>
        </div>
        <div class="projectsList" id="projectsList"></div>
      </aside>
      <main class="tasks" id="tasks">
        <!-- Todos -->
        <h2>Tasks List</h2>
      </main>
      <section class="details" id="details">
        <!-- Expanded todo details -->
        <h2>Due Soon</h2>
      </section>
    </div>
  </body>
</html>
