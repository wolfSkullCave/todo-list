<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Webpack Template</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <!-- Project list -->
         <div class="projectsHeader">
          <h2>Projects</h2>
          <div>
            <input type="text" id="addProjectInput" placeholder="Add Project" />
            <button type="button" id="addProjectBtn">+</button>
          </div>
        </div>

        <div class="projectsList" id="projectsList"></div>
      </aside>
      <main class="tasks" id="taskbar">
        <!-- Todos -->
        <div class="taskHeader">
          <h2 id="taskBarHeading">Tasks List</h2>
          <div class="addTaskDiv">
            <input type="text" id="addTaskInput" placeholder="Add a Task">
            <button id="addTaskBtn">+</button>
          </div>
        </div>
        <div id="taskContent"></div>
      </main>
      <section class="details" id="details">
        <!-- Expanded todo details -->
        <h2>Due Soon</h2>
      </section>
    </div>
  </body>
</html>
